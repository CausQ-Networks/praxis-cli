name: Release Praxis CLI binaries

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid version: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-trimpath"
        run: make -j 8 go-build-release VERSION="${{ steps.ver.outputs.tag }}"

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          Praxis-branded CLI rebuild from CausQ-Networks/praxis-cli.

          Install:
          \`\`\`bash
          curl -fsSL https://praxis.causq.com/get-cli.sh | bash
          \`\`\`
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bin/praxis-cli_* --clobber
            gh release edit "$TAG" --title "Praxis CLI $TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" bin/praxis-cli_* \
              --title "Praxis CLI $TAG" \
              --notes "$NOTES"
          fi
          ls -lh bin/
